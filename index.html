<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUSANTARA CLASH</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071525;
  color:white;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

#menu{
  min-height:100vh;
  padding:25px 15px;
  text-align:center;
}

h1{
  color:#ffd43b;
  font-size:42px;
  margin:10px 0;
}

.subtitle{
  color:#b9c7d9;
}

.panel{
  max-width:1000px;
  margin:auto;
  background:#101f34;
  border:2px solid #29415f;
  border-radius:20px;
  padding:20px;
}

h2{
  color:#ffd43b;
  margin-top:25px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:12px;
}

.card{
  background:#192d47;
  color:white;
  border:3px solid #38516e;
  border-radius:15px;
  padding:15px;
  min-height:120px;
  cursor:pointer;
  touch-action:manipulation;
}

.card:active{
  transform:scale(.96);
}

.card.selected{
  border-color:#00e5ff;
  background:#21405e;
  box-shadow:0 0 15px #00e5ff66;
}

.icon{
  font-size:45px;
}

.card b{
  display:block;
  font-size:17px;
  margin-top:7px;
}

.card small{
  color:#b9c7d9;
}

.start{
  margin-top:25px;
  background:#ffd43b;
  color:#111;
  border:0;
  border-radius:14px;
  padding:16px 28px;
  font-size:18px;
  font-weight:bold;
}

.start:active{
  transform:scale(.95);
}

#game{
  display:none;
  min-height:100vh;
  padding:12px;
}

.top{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.player{
  flex:1;
}

.hpbox{
  height:24px;
  background:#222;
  border:2px solid white;
  border-radius:20px;
  overflow:hidden;
}

.hp{
  height:100%;
  width:100%;
  background:#22d45a;
}

.enemy .hp{
  background:#ff4757;
}

.timer{
  font-size:28px;
  color:#ffd43b;
  font-weight:bold;
}
